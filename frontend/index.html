<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Papers By Kevin"
    />
    <title>Kevin Raval</title>
    <!-- Sets the theme attribute before first paint so an explicit choice
         (stored by ThemeToggle) doesn't flash the wrong theme. No stored
         choice means no attribute here — the CSS media query alone
         handles that case. -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
